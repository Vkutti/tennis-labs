<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" type="text/css" href="/static/index.css"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tom Select -->
  <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css" rel="stylesheet">

  <title>TennisLab</title>

  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/tennislablogo.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/tennislablogo.png">
  <link rel="icon" type="image/svg+xml" href="/static/tennislablogosvg.svg">
  <link rel="apple-touch-icon" href="/static/tennislablogo.png">

</head>


<body>


<div class="aurora-bg" aria-hidden="true">
  <span class="aurora-layer aurora-layer-1"></span>
  <span class="aurora-layer aurora-layer-2"></span>
  <span class="aurora-layer aurora-layer-3"></span>
</div>



<div class="page-loader" id="page-loader" aria-hidden="true">

  <div class="loader-orb" aria-hidden="true"></div>

  <p>
    Simulating match...
  </p>

</div>




<div class="page-shell page-shell--home">


  <div class="title fade-in-up">

    <p class="eyebrow">
      Match Intelligence
    </p>


    <h1>
      TennisLab
    </h1>


    <p class="subtitle">
      Simulate iconic matchups and discover who wins over five sets.
    </p>

  </div>





<form action="/simulate" method="post" class="match-form fade-in-up" style="animation-delay:120ms;">



<div class="versus">
    <div class="field-group">
        <label for="tennis_players_a">
            Player A
        </label>

        <select 
            name="tennis_players_a"
            id="tennis_players_a"
            required
        >

            <option value="">
                Search player...
            </option>


            {% for player in players %}

                <option value="{{ player }}">
                    {{ player }}
                </option>

            {% endfor %}


        </select>


    </div>




    <h1 class="vs-badge">
        VS
    </h1>




    <!-- PLAYER B -->

    <div class="field-group">

        <label for="tennis_players_b">
            Player B
        </label>


        <select 
            name="tennis_players_b"
            id="tennis_players_b"
            required
        >

            <option value="">
                Search player...
            </option>


            {% for player in players %}

                <option value="{{ player }}">
                    {{ player }}
                </option>

            {% endfor %}


        </select>


    </div>


</div>





<!-- COURT TYPE -->

<div class="field-group court-group">


    <label for="court_type">
        Court Surface
    </label>


    <select
        name="court_type"
        id="court_type"
        required
    >

        <option value="">
            Select surface...
        </option>


        <option value="Hard">
            Hard
        </option>


        <option value="Clay">
            Clay
        </option>


        <option value="Grass">
            Grass
        </option>


        <option value="Carpet">
            Carpet
        </option>


    </select>


</div>






<button type="submit">

    <span class="button-spinner" aria-hidden="true"></span>

    <span class="button-label">
        Simulate Match
    </span>

</button>




</form>



</div>





<!-- Tom Select JS -->

<script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>




<script>


new TomSelect("#tennis_players_a", {

    create: false,

    maxOptions: 100,

    placeholder: "Search player...",

    sortField: {
        field: "text",
        direction: "asc"
    }

});





new TomSelect("#tennis_players_b", {

    create: false,

    maxOptions: 100,

    placeholder: "Search player...",

    sortField: {
        field: "text",
        direction: "asc"
    }

});





new TomSelect("#court_type", {

    create: false,

    placeholder: "Select surface..."

});



</script>




<script src="/static/ui.js"></script>


</body>

</html>
